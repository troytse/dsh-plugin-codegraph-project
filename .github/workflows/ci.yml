name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Node.js 20 reached end-of-life in April 2026, and GitHub now forces the Node.js 20
      # action runtime to Node.js 24 and warns on every job for it. The package still DECLARES
      # `engines.node: ">=20"`, so `npm run lint` runs `scripts/check-node-compat.mjs` instead:
      # it refuses APIs that do not exist on the declared minimum, which is the failure a CI leg
      # on Node.js 20 used to catch (and did catch once, for `Promise.withResolvers`).
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # No lockfile is committed on purpose: the harness peers are published
      # under the `next` dist-tag, and the ranges in package.json select them.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Cheap and dependency-free: catches a syntax error in a file no test
      # happens to import (the manual scripts, for one).
      - name: Syntax check
        run: npm run lint

      - name: Run tests
        run: npm test
